# Cloud control plane: TimescaleDB + Mosquitto (TLS) + central-backend + web-frontend + Caddy.
# The plant edge is a separate compose file and runs on the plant PC.
#
#   docker compose -f docker-compose.cloud.yml up -d --build
#
# Run scripts/Generate-DevTls.ps1 (or generate-dev-tls.sh) before first boot so certs/passwd exist.
# Publish MQTTS 8883 only on a VPN; do not expose it on the public internet without ACL review.

include:
  - docker-compose.yml

services:
  timescaledb:
    ports: !reset []
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    shm_size: 512mb
    deploy:
      resources:
        limits:
          memory: 1024M

  mosquitto:
    ports: !reset ["${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_TLS_PORT:-8883}:8883"]
    deploy:
      resources:
        limits:
          memory: 128M

  central-backend:
    build:
      context: ./central-backend
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-smartfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfactory}
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
      MQTT_BROKER_URL: ssl://mosquitto:8883
      MQTT_USERNAME: ${MQTT_CENTRAL_USERNAME:-central-backend}
      MQTT_PASSWORD: ${MQTT_CENTRAL_PASSWORD:?MQTT_CENTRAL_PASSWORD must be set}
      MQTT_CA_CERT_PATH: /certs/ca.crt
      OPC_ENDPOINT_URL: ${OPC_ENDPOINT_URL:-opc.tcp://localhost:53530/OPCUA/SimulationServer}
      APP_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN:-}
      APP_REGISTRY_SEED_ENABLED: ${APP_REGISTRY_SEED_ENABLED:-true}
      APP_ONBOARDING_PROBE_ENABLED: ${APP_ONBOARDING_PROBE_ENABLED:-false}
      EDGE_BASE_URL: ${EDGE_BASE_URL:-http://127.0.0.1:8081}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./infra/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - smart-factory
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  web-frontend:
    build:
      context: ./web-frontend
      args:
        BACKEND_ORIGIN: http://central-backend:8080
        NEXT_PUBLIC_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN:-}
    environment:
      BACKEND_ORIGIN: http://central-backend:8080
      NEXT_PUBLIC_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN:-}
    depends_on:
      central-backend:
        condition: service_healthy
    networks:
      - smart-factory
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      central-backend:
        condition: service_healthy
      web-frontend:
        condition: service_started
    networks:
      - smart-factory
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  caddy_data:
  caddy_config: