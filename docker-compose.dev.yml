# Laptop demo: cloud control plane and one edge container together.
# Prosys (or any OPC UA server) stays on the Windows host, not in this compose.
#
#   scripts/Generate-DevTls.ps1
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Edge reaches Mosquitto by compose DNS. OPC UA uses host.docker.internal
# unless OPC_UA_ENDPOINT is set to the simulator URL.

include:
  - docker-compose.cloud.yml
  - docker-compose.edge.yml

services:
  caddy:
    volumes: !override
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/routes.caddy:/etc/caddy/routes.caddy:ro
      - ./infra/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

  central-backend:
    environment:
      MQTT_USERNAME: ${MQTT_CENTRAL_USERNAME:-central-backend}
      MQTT_PASSWORD: ${MQTT_CENTRAL_PASSWORD:-central-dev}
      APP_ONBOARDING_PROBE_ENABLED: "true"
      EDGE_BASE_URL: http://plant-edge:8081

  plant-edge:
    environment:
      MQTT_BROKER_URL: ssl://mosquitto:8883
      MQTT_USERNAME: ${MQTT_EDGE_USERNAME:-edge-INDORE}
      MQTT_PASSWORD: ${MQTT_EDGE_PASSWORD:-edge-indore-dev}
      MQTT_CA_CERT_PATH: /certs/ca.crt
      CENTRAL_BASE_URL: https://caddy
      CENTRAL_CA_CERT_PATH: /certs/ca.crt
      APP_ONBOARDING_PROBE_ENABLED: "true"
      EDGE_CONFIG_SNAPSHOT_PATH: /data/edge-config.json
      OPC_UA_ENDPOINT: ${OPC_UA_ENDPOINT:-${OPC_ENDPOINT_URL:-opc.tcp://host.docker.internal:53530/OPCUA/SimulationServer}}
    depends_on:
      mosquitto:
        condition: service_healthy
      caddy:
        condition: service_started
    networks:
      - smart-factory