server:
  port: 8081
  # Host runs stay on loopback. The edge container sets SERVER_ADDRESS=0.0.0.0 and publishes 127.0.0.1:8081 on the plant PC.
  address: 127.0.0.1
  tomcat:
    threads:
      max: 8

spring:
  application:
    name: plant-edge-service

app:
  opcua:
    # Prefer OPC_UA_ENDPOINT; fall back to OPC_ENDPOINT_URL (shared with central-backend).
    endpoint-url: ${OPC_UA_ENDPOINT:${OPC_ENDPOINT_URL:opc.tcp://localhost:53530/OPCUA/SimulationServer}}
    request-timeout-ms: 5000
    publishing-interval-ms: 500
    monitored-item-queue-size: 10
    reconnect-initial-ms: 1000
    reconnect-max-ms: 30000
    security:
      # Local/dev simulator only. Secured servers use Basic256Sha256 + a populated pki-dir.
      policy: None
      identity: anonymous
      pki-dir: ${OPC_UA_PKI_DIR:}
    # No app.opcua.tags here: the central registry manifest is the single source of truth (M3.4).
    # Static mode (EDGE_CONFIG_SYNC_ENABLED=false) must supply its own app.opcua.tags list.
  buffer:
    path: ${EDGE_BUFFER_PATH:./data/edge-outbound.db}
    max-records: ${EDGE_BUFFER_MAX_RECORDS:10000}
    drain-batch-size: ${EDGE_BUFFER_DRAIN_BATCH:32}
    drain-pause-ms: ${EDGE_BUFFER_DRAIN_PAUSE_MS:10}
  onboarding:
    # Plant-LAN port oracle: stays off unless dev or the Prosys protocol tests opt in. M4.2 closes it.
    probe-enabled: ${APP_ONBOARDING_PROBE_ENABLED:false}
  edge:
    # OPC UA hot-reload owns the tag list. Set false only to fall back to an explicit YAML list.
    config-sync-enabled: ${EDGE_CONFIG_SYNC_ENABLED:true}
    site-id: ${EDGE_SITE_ID:INDORE}
    central-base-url: ${CENTRAL_BASE_URL:http://localhost:8080}
    config-poll-ms: ${EDGE_CONFIG_POLL_MS:15000}
    config-timeout-ms: ${EDGE_CONFIG_TIMEOUT_MS:5000}
    snapshot-path: ${EDGE_CONFIG_SNAPSHOT_PATH:./data/edge-config.json}
  mqtt:
    # Full URL wins. On a plant PC this is the cloud broker; the laptop dev compose uses tcp://mosquitto:1883.
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:${MQTT_PORT:1883}}
    client-id: ${EDGE_MQTT_CLIENT_ID:plant-edge}
    qos: 1
    reconnect-initial-ms: 1000
    reconnect-max-ms: 30000

logging:
  level:
    root: INFO
    com.factory.edge: INFO
