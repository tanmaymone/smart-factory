server:
  tomcat:
    threads:
      max: 20

spring:
  application:
    name: central-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_factory}
    username: ${POSTGRES_USER:smartfactory}
    password: ${POSTGRES_PASSWORD:smartfactory}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  bootstrap:
    # Empty fails closed. Set APP_BOOTSTRAP_TOKEN for first-run registry and actor provisioning.
    token: ${APP_BOOTSTRAP_TOKEN:}
    actor-id: ${APP_BOOTSTRAP_ACTOR_ID:bootstrap-admin}
    display-name: ${APP_BOOTSTRAP_DISPLAY_NAME:Bootstrap Admin}
  onboarding:
    # Off in production: the probe is a scanner on the plant LAN. Dev/Prosys profiles opt in.
    probe-enabled: ${APP_ONBOARDING_PROBE_ENABLED:false}
    # One local edge beside Central for this onboarding path, not per-site routing.
    edge-base-url: ${EDGE_BASE_URL:http://127.0.0.1:8081}
  registry:
    # Override when Prosys advertises a hostname (e.g. opc.tcp://Tanmay:53530/OPCUA/SimulationServer)
    opc-endpoint-url: ${OPC_ENDPOINT_URL:opc.tcp://localhost:53530/OPCUA/SimulationServer}
    seed-enabled: ${APP_REGISTRY_SEED_ENABLED:true}
  mqtt:
    # Full URL wins. Host runs keep tcp://localhost:1883. Cloud compose sets tcp://mosquitto:1883.
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:${MQTT_PORT:1883}}
    client-id: central-backend
    qos: 1
  cache:
    mode: ${CACHE_MODE:memory}
    redis-host: ${REDIS_HOST:localhost}
    redis-port: ${REDIS_PORT:6379}
  telemetry:
    batch-size: 200
    flush-interval-ms: 500
    queue-capacity: 2000
  stream:
    emitter-timeout-ms: 1800000
    heartbeat-ms: 15000
    max-subscribers: 32
    dispatch-pool-size: 2
    dispatch-queue-capacity: 64

management:
  endpoints:
    web:
      exposure:
        include: health,info
