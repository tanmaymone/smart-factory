services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: smart-factory-timescaledb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfactory}
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - smart-factory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartfactory} -d ${POSTGRES_DB:-smart_factory}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-factory-mosquitto
    environment:
      MQTT_HEALTH_USERNAME: ${MQTT_HEALTH_USERNAME:-healthcheck}
      MQTT_HEALTH_PASSWORD: ${MQTT_HEALTH_PASSWORD:-healthcheck-dev}
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./infra/certs/broker.crt:/mosquitto/certs/broker.crt:ro
      - ./infra/certs/broker.key:/mosquitto/certs/broker.key:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smart-factory
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -u \"$$MQTT_HEALTH_USERNAME\" -P \"$$MQTT_HEALTH_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  smart-factory:
    driver: bridge

volumes:
  timescale_data:
  mosquitto_data:
  mosquitto_log: